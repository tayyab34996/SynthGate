vars:
  - configs/data.yaml

stages:
  prepare_data:
    cmd: uv run python -m synthgate.data --config configs/data.yaml
    deps:
      - ${source.input}
      - src/synthgate/data.py
      - configs/data.yaml
      - pyproject.toml
      - uv.lock
    outs:
      - data/processed/shipments.csv
      - data/processed/train.csv
      - data/processed/holdout.csv
      - data/processed/profile.json

  train_gaussian_copula:
    cmd: uv run python -m synthgate.generation --model gaussian_copula
    deps:
      - data/processed/train.csv
      - data/processed/profile.json
      - configs/models.yaml
      - configs/contracts/normal_operations.yaml
      - configs/contracts/delivery_disruption.yaml
      - src/synthgate/contracts.py
      - src/synthgate/generation.py
      - src/synthgate/tracking.py
      - src/synthgate/data.py
      - pyproject.toml
      - uv.lock
    outs:
      - data/generated/gaussian_copula
      - models/gaussian_copula.pkl
      - models/gaussian_copula_metadata.json

  train_ctgan:
    cmd: uv run python -m synthgate.generation --model ctgan
    deps:
      - data/processed/train.csv
      - data/processed/profile.json
      - configs/models.yaml
      - configs/contracts/normal_operations.yaml
      - configs/contracts/delivery_disruption.yaml
      - src/synthgate/contracts.py
      - src/synthgate/generation.py
      - src/synthgate/tracking.py
      - src/synthgate/data.py
      - pyproject.toml
      - uv.lock
    outs:
      - data/generated/ctgan
      - models/ctgan.pkl
      - models/ctgan_metadata.json

  evaluate:
    cmd: uv run python -m synthgate.evaluation
    deps:
      - data/processed/train.csv
      - data/processed/holdout.csv
      - data/generated/gaussian_copula/normal_operations.csv
      - data/generated/gaussian_copula/normal_operations.json
      - data/generated/gaussian_copula/delivery_disruption.csv
      - data/generated/gaussian_copula/delivery_disruption.json
      - data/generated/ctgan/normal_operations.csv
      - data/generated/ctgan/normal_operations.json
      - data/generated/ctgan/delivery_disruption.csv
      - data/generated/ctgan/delivery_disruption.json
      - configs/models.yaml
      - configs/contracts/normal_operations.yaml
      - configs/contracts/delivery_disruption.yaml
      - src/synthgate/contracts.py
      - src/synthgate/data.py
      - src/synthgate/evaluation.py
      - src/synthgate/tracking.py
      - pyproject.toml
      - uv.lock
    outs:
      - artifacts/evaluation
