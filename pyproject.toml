[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthgate"
version = "0.1.0"
description = "Scenario-aware synthetic shipment data generation with contract-based release gates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagshub>=0.5",
    "dvc>=3.50",
    "mlflow>=2.12",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "sdmetrics>=0.18",
    "sdv>=1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synthgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
